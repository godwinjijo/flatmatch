# ---- Database (PostgreSQL) ----
# FLATMATCH_* prefix avoids collisions with other projects' env vars
# (e.g. another app's DB_PASSWORD on this machine). Defaults = local dev.
spring.datasource.url=${FLATMATCH_DB_URL:jdbc:postgresql://localhost:5432/flatmatch}
spring.datasource.username=${FLATMATCH_DB_USERNAME:postgres}
spring.datasource.password=${FLATMATCH_DB_PASSWORD:@Godwin24}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---- JPA / Hibernate ----
# update = auto-create/alter tables from entities (fine for dev, never use in prod)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ---- Server ----
# 8080 is occupied by a local Apache (httpd) service, so we use 8081
# Port comes from the platform (Render sets PORT); 8081 stays the local default
server.port=${PORT:8081}

app.jwt.secret=${FLATMATCH_JWT_SECRET:H0BjDCFMS1TK+iRLnKiNnFxlKoFzrryeXlTTEJz//u8luDtLjSAqjj272SQaNM5U}
app.jwt.expiration-ms=86400000

# Frontend origin(s) allowed by CORS, comma-separated (dev defaults first)
app.cors.allowed-origins=${FLATMATCH_FRONTEND_URL:http://localhost:5173,http://localhost:5174}
